# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Session PHP pour l'auth démo — cookie Lax pour que le proxy Vite (même origine) conserve la session.
    session:
        handler_id: null
        cookie_secure: false
        cookie_samesite: lax
        cookie_path: /
        cookie_httponly: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
